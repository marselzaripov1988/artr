# Проверки на каждый толчок и запрос слияния.
#
# До этого CI не было вовсе, и за миграцию на SDK 0.53 это обошлось
# дважды: панику на sdk.Tx и неотправляемые транзакции нашли на сервере,
# а не в проверках. Здесь закрыты три щели, каждая из которых уже
# однажды пропустила поломку.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Новый толчок в ту же ветку отменяет прежний прогон: держать очередь
# из устаревших проверок незачем.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версию берём из go.mod, чтобы она не разъезжалась с проектом.
          go-version-file: go.mod
          cache: true

      # Это и есть проверка собираемости из клона.
      #
      # Раньше сгенерированный protobuf лежал в .gitignore, и клон не
      # собирался: 56 файлов существовали только у того, кто их создал.
      # Здесь checkout даёт ровно отслеживаемое содержимое, поэтому
      # повторение той истории уронит сборку сразу.
      - name: go build
        run: go build ./...

      # Тег testing включает app/test-helper.go — без него наборы тестов
      # не собираются.
      - name: go test
        run: go test -tags testing ./...

  proto:
    name: описания и сгенерированный код
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Сгенерированный код лежит в репозитории — иначе клон не
      # собрать, — и потому может разойтись с описаниями: правку в
      # proto/ легко закоммитить, забыв перегенерировать. Ровно так
      # едва не потерялась разметка подписанта сообщений.
      #
      # Генерация побайтово воспроизводима, поэтому непустой diff после
      # неё означает одно: сгенерированное устарело.
      - name: собрать образ генерации
        run: docker build -f scripts/protocgen.Dockerfile -t artr-protogen .

      - name: перегенерировать
        run: |
          docker run --rm -v "$PWD:/src" -w /src artr-protogen bash ./scripts/protocgen.sh
          # Контейнер пишет от root; возвращаем файлы бегуну, иначе
          # последующие шаги спотыкаются о права.
          sudo chown -R "$(id -u):$(id -g)" .

      - name: сгенерированное должно совпадать с описаниями
        run: |
          if ! git diff --quiet; then
            echo "::error::Сгенерированный код разошёлся с proto/. Запустите make proto-gen и закоммитьте результат."
            git diff --stat
            exit 1
          fi
          echo "сгенерированное совпадает с описаниями"
