syntax = "proto3";
package artery.noding.v1beta1;

import "gogoproto/gogo.proto";
import "artery/referral/v1beta1/types.proto";
import "artery/noding/v1beta1/types.proto";

option go_package = "github.com/arterynetwork/artr/x/noding/types";

message Params {
  option (gogoproto.goproto_stringer) = false;

  reserved 5;
  reserved "min_status";

  uint32 max_validators = 1;
  uint32 jail_after = 2;
  uint32 unjail_after = 3;
  uint32 lottery_validators = 4;
  MinCriteria min_criteria = 7 [(gogoproto.nullable) = false];

  // MisbehaviourPenalty - доля собственной делегации валидатора, изымаемая
  // за византийское поведение. Изъятое уходит на счёт модуля, а не
  // сжигается: предложение монет не меняется, меняется владелец.
  //
  // Берётся только собственная делегация нарушителя. Средства прочих
  // участников трогать нельзя: в Artery не делегируют конкретному
  // валидатору, и люди в его реферальном дереве к его честности
  // отношения не имеют.
  string misbehaviour_penalty = 8 [
    (gogoproto.nullable)   = false,
    (gogoproto.customtype) = "github.com/arterynetwork/artr/util.Fraction"
  ];
  Distribution voting_power = 6 [(gogoproto.nullable) = false];
}
